# One-off, manually triggered: runs norm-archive's library audit on GitHub's
# runners (which can reach archive.org) and publishes the report plus the raw
# archive.org metadata to the throwaway `audit-data` branch. Doesn't touch
# the app or the Vercel deploy.
name: Norm library audit

on:
  workflow_dispatch:
  push:
    branches: [claude/norm-macdonald-archive-library-3o5eb3]
    paths:
      - norm-archive/scripts/audit-library.mjs
      - .github/workflows/norm-library-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: norm-archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run audit
        run: node scripts/audit-library.mjs --out audit-report.md
      - name: Publish to the audit-data branch
        run: |
          mkdir -p /tmp/audit/norm-archive
          cp -r .audit-cache audit-report.md /tmp/audit/
          # Vercel builds every branch from norm-archive/; without this it
          # tries to deploy the report and emails a failed preview.
          echo '{ "git": { "deploymentEnabled": false } }' > /tmp/audit/norm-archive/vercel.json
          cd /tmp/audit
          git init -q -b audit-data
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Library audit ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" audit-data
