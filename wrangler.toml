# Fitness tracker — deliberately separate from the World Cup app's
# top-level wrangler config. Deploys as its own Worker ("fitness-tracker")
# so the worldcup Worker is untouched.

name = "fitness-tracker"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Built React UI is served as static assets; /api/* falls through to the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "fitness-tracker"
# Run `npm run db:create` and paste the id it prints here:
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional: set a token to require `Authorization: Bearer <token>` on every
# request once deployed publicly. Use `wrangler secret put API_TOKEN`.
